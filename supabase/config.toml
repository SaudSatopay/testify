# Supabase project configuration for Testify.
# Reference: https://supabase.com/docs/guides/local-development/cli/config

project_id = "testify"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Local email testing server (captures auth emails during development).
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "200MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true

# ---------------------------------------------------------------------------
# Edge functions.
# verify_jwt = false for ALL functions because the browser's CORS preflight
# (OPTIONS) carries no Authorization header and would otherwise be rejected
# before reaching the function. Every function verifies the JWT itself in
# code via requireUser() - there is no unauthenticated code path.
# ---------------------------------------------------------------------------

[functions.generate-question]
verify_jwt = false # JWT verified in code (requireUser) so CORS preflight works

[functions.generate-interview]
verify_jwt = false # JWT verified in code (requireUser) so CORS preflight works

[functions.analyze-answer]
verify_jwt = false # JWT verified in code (requireUser) so CORS preflight works

[functions.transcribe-response]
verify_jwt = false # JWT verified in code (requireUser) so CORS preflight works

[functions.analyze-video]
verify_jwt = false # JWT verified in code (requireUser) so CORS preflight works

[functions.calculate-interview-result]
verify_jwt = false # JWT verified in code (requireUser) so CORS preflight works

[functions.generate-report]
verify_jwt = false # JWT verified in code (requireUser) so CORS preflight works

[functions.send-interview-invitation]
verify_jwt = false # JWT verified in code (requireUser) so CORS preflight works

[functions.admin-users]
verify_jwt = false # JWT verified in code (requireUser + service-role admin check) so CORS preflight works
